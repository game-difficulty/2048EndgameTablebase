map $http_cf_connecting_ip $ws_limit_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_conn_zone $ws_limit_key zone=ws_conn_per_client:10m;
limit_req_zone $ws_limit_key zone=ws_req_per_client:10m rate=3r/s;

server {
    listen 80;
    server_name 2048tables.online www.2048tables.online;

    client_max_body_size 64m;
    limit_conn_status 429;
    limit_req_status 429;

    location /ws/ {
        access_log off;
        limit_conn ws_conn_per_client 24;
        limit_req zone=ws_req_per_client burst=30 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        tcp_nodelay on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name 2048tables.online www.2048tables.online;

    ssl_certificate /etc/nginx/ssl/2048tables.online.crt;
    ssl_certificate_key /etc/nginx/ssl/2048tables.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;
    limit_conn_status 429;
    limit_req_status 429;

    location /ws/ {
        access_log off;
        limit_conn ws_conn_per_client 24;
        limit_req zone=ws_req_per_client burst=30 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        tcp_nodelay on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
