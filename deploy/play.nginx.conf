limit_req_zone $binary_remote_addr zone=play_api:1m rate=12r/s;

server {
    listen 80;
    server_name play.2048tables.online;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name play.2048tables.online;
    ssl_certificate /etc/letsencrypt/live/play.2048tables.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.2048tables.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/live-cloudflare-realip.conf;
    root /opt/2048tables/play/current/frontend/dist;
    gzip_static on;
    # Manual archive applications accept replay files up to 2 MiB. Keep the
    # proxy limit slightly higher so FastAPI can return the precise app-level
    # validation error instead of nginx rejecting a valid-size upload first.
    client_max_body_size 3m;
    limit_req_status 429;

    location = / {
        try_files /human/index.html =404;
        add_header Cache-Control no-cache;
    }
    location = /human/ { return 308 /; }
    location = /human/index.html { return 308 /; }
    location ^~ /human/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/user/[^/]+/?$ {
        try_files /human/index.html =404;
        add_header Cache-Control no-cache;
    }
    location ~ ^/leaderboard/?$ {
        try_files /human/index.html =404;
        add_header Cache-Control no-cache;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /compat/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /verse-replay/fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /verse-replay/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control no-cache;
    }
    location /payments/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /favicon.ico { try_files $uri =404; expires 1d; }

    location ^~ /media/avatars/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
    }
    location ~ ^/api/human/leaderboards/(?:catalog|full)$ {
        limit_req zone=play_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
    }
    location /api/ {
        limit_req zone=play_api burst=40 nodelay;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control no-store always;
    }
    location / { return 404; }
}
