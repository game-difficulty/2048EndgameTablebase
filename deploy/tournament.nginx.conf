server {
    listen 80;
    server_name tournament.2048tables.online;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name tournament.2048tables.online;

    # The current Cloudflare origin connection already uses this private origin
    # certificate. The browser-facing certificate is managed by Cloudflare.
    ssl_certificate /etc/nginx/ssl/2048tables.online.crt;
    ssl_certificate_key /etc/nginx/ssl/2048tables.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/live-cloudflare-realip.conf;

    root /opt/2048tables/tournament/current/dist;

    location = / { return 302 /practice; }
    location = /test { try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /test/ { return 308 /test; }
    location ~ "^/events(?:/[a-z0-9]+(?:-[a-z0-9]+)*)?/?$" { try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /practice { try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /practice/ { return 308 /practice; }
    location ~ ^/practice/(?:[1-9]|1[0-5])/?$ { try_files /index.html =404; add_header Cache-Control no-cache; }

    # Project-ref URLs remain available for links frozen into competition data.
    location = /projects { try_files /index.html =404; add_header Cache-Control no-cache; }
    location = /projects/ { return 308 /projects; }
    location ~ "^/projects/[a-z0-9][a-z0-9-]{0,79}/?$" { try_files /index.html =404; add_header Cache-Control no-cache; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /wasm/ {
        types {
            application/javascript js;
            application/wasm wasm;
        }
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /favicon.ico { try_files $uri =404; expires 1d; }

    location ~ "^/rooms/[A-Za-z0-9]+/?$" {
        try_files /index.html =404;
        add_header Cache-Control no-cache;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        add_header Cache-Control no-store always;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location / { return 404; }
}
