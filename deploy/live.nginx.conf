limit_req_zone $binary_remote_addr zone=live_http:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=live_viewers:1m;
limit_req_zone $binary_remote_addr zone=live_publish_requests:1m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=live_publish_connections:1m;

server {
    listen 80;
    server_name live.2048tables.online;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name live.2048tables.online;
    ssl_certificate /etc/letsencrypt/live/live.2048tables.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.2048tables.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/live-cloudflare-realip.conf;
    root /opt/2048tables/app/frontend/dist;
    client_max_body_size 8m;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";

    location = / { try_files /live/index.html =404; add_header Cache-Control no-cache; }
    location = /live/ { return 302 /; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /compat/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
    location /live-gifts/ { try_files $uri =404; expires 1d; }
    location /live-music/ { try_files $uri =404; expires 30d; }
    location /payments/ { try_files $uri =404; expires 1d; }
    location ^~ /media/avatars/ {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /favicon.ico { try_files $uri =404; expires 1d; }
    location = /api/live/watch {
        access_log off;
        limit_conn live_viewers 8;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_read_timeout 45s;
        proxy_buffering off;
    }
    location = /api/live/publish {
        access_log off;
        limit_req zone=live_publish_requests burst=5 nodelay;
        limit_conn live_publish_connections 2;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Extensions "";
        proxy_read_timeout 45s;
        proxy_buffering off;
    }
    location /api/ {
        limit_req zone=live_http burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control no-store always;
    }
    location / { return 404; }
}
